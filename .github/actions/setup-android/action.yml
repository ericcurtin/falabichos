# SPDX-License-Identifier: Apache-2.0
name: Set up Android toolchain
description: JDK 17, Android SDK, NDK, and Gradle for the mobile builds
runs:
  using: composite
  steps:
    - uses: actions/setup-java@v6
      with: { distribution: temurin, java-version: 17 }
    - uses: android-actions/setup-android@v3
      with:
        packages: platform-tools # the default "tools" package no longer exists
    - run: sdkmanager "ndk;26.3.11579264" "platforms;android-34" "build-tools;34.0.0"
      shell: bash
    - uses: gradle/actions/setup-gradle@v4
      with: { gradle-version: 8.9 }
