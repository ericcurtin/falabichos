name: Feature request
description: Suggest an improvement to the game or the tools
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations: { required: true }
  - type: textarea
    id: why
    attributes:
      label: Why would it help learners or contributors?
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Gameplay, Learning design / exercises, UI / accessibility, Mobile, Tools / content pipeline, Audio, Art, Other]
