# SPDX-License-Identifier: Apache-2.0
# Tagged release: builds artifacts for Linux, macOS, Windows, Android and iOS (simulator) and attaches
# them to a GitHub release. Nothing here is signed unless you add the signing secrets (see docs/BUILDING.md).
name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev libvulkan-dev pkg-config clang mold
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask package-linux
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: "dist/*.tar.gz" }

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask package-macos
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: "dist/*.dmg" }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask package-windows
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: "dist/*.zip" }

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "ndk;26.3.11579264" "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with: { gradle-version: 8.9 }
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-ndk --locked
      - env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.3.11579264
        run: |
          cargo xtask android
          gradle -p mobile/android bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            mobile/android/app/build/outputs/apk/release/*.apk
            mobile/android/app/build/outputs/bundle/release/*.aab

  ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          targets: aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask ios
      - name: Zip the simulator app
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData mobile/ios/build -name Falabichos.app -type d 2>/dev/null | head -1)
          mkdir -p dist && ditto -c -k --keepParent "$APP" dist/Falabichos-ios-simulator.zip
      - uses: actions/upload-artifact@v4
        with: { name: ios-simulator, path: "dist/*.zip" }

  publish:
    needs: [linux, macos, windows, android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**
